<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RASENKS Games Library</title>

  <link rel="icon" type="image/png" href="sly.png">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html {
      cursor: url('kurisu.png'), pointer;
    }

    body {
      background: url("okab.png") repeat-x fixed;
      background-color: #020617;
    }

    .titulo {
      text-shadow: 0 0 25px #dc2626, 0 0 50px #7f1d1d;
    }

    .game-card {
      background: linear-gradient(135deg, #1e1b4b, #312e81, #1e40af);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 30px rgba(0,0,0,0.6);
    }

    #search {
      background: linear-gradient(145deg, #312e81, #1e1b4b);
      border: 2px solid #a855f7;
    }

    #search:focus {
      outline: none;
      border-color: #e879f9;
      box-shadow: 0 0 15px #c084fc;
    }
  </style>
</head>

<body class="text-white min-h-screen">

  <main class="container mx-auto px-6 py-10">

    <h1 class="text-5xl font-extrabold text-center mb-12 titulo">
      Juegos Terminados
    </h1>

    <div class="flex justify-center mb-10">
      <input
        id="search"
        type="text"
        placeholder="Buscar juego..."
        class="w-full md:w-2/3 lg:w-1/2 p-4 rounded-xl text-lg text-white"
      />
    </div>

    <section
      id="game-list"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"
    ></section>

  </main>

      "Assassin’s Creed Unity",
      "Assassin’s Creed Syndicate",
      "Assassin’s Creed Origins",

      "Battlefield 1",
      "Battlefield 3",
      "Battlefield 4",
      "Battlefield: Bad Company 2",

      "Call of Duty",
      "Call of Duty 2",
      "Call of Duty: World at War",
      "Call of Duty: Black Ops",
      "Call of Duty: Black Ops II",
      "Call of Duty: Black Ops III",
      "Call of Duty: Modern Warfare",
      "Call of Duty: Modern Warfare 2",
      "Call of Duty: Modern Warfare 3",
      "Call of Duty: Infinite Warfare",
      "Call of Duty: WWII",

      "Crash of the Titans",
      "Dark Souls",
      "Dark Souls II",
      "Dark Souls III",
      "Sekiro: Shadows Die Twice",
      "Elden Ring",

      "DOOM",
      "DOOM Eternal",
      "Death Stranding",

      "Far Cry 3",
      "Far Cry 4",
      "Far Cry 5",
      "Far Cry Primal",

      "Final Fantasy XV",
      "Final Fantasy VII",

      "For Honor",

      "Grand Theft Auto IV",
      "Grand Theft Auto: San Andreas",
      "Grand Theft Auto V",
      "Grand Theft Auto: Vice City Stories",

      "Halo: Combat Evolved",
      "Halo 2",

      "Halo 4",
      "Halo: Reach",
      "Halo Infinite",

      "Hitman 2",
      "Hitman (2016)",
      "Hitman: Absolution",
      "Hitman: Blood Money",
      "Hitman 3",

      "Kingdom Come: Deliverance",
      "Kingdom Come: Deliverance II",

      "Mafia III",
      "Mafia: Definitive Edition",

      "Metro 2033",
      "Metro: Last Light",
      "Metro Exodus",

      "Peter Jackson’s King Kong",
      "Red Dead Redemption 2",

      "The Legend of Zelda: Breath of the Wild",

      "Ratchet & Clank",
      "Alan Wake",

      "Portal",
      "Portal 2",

      "The Callisto Protocol",
      "Dishonored 2",
      "Silent Hill 2 Remake"
    ];

    const container = document.getElementById("game-list");
    const search = document.getElementById("search");

    function render(list) {
      container.innerHTML = "";
      list.forEach((game, i) => {
        const card = document.createElement("div");
        card.className = "game-card rounded-xl p-6 text-center";

        card.innerHTML = `
          <p class="text-sm text-purple-300 mb-2">#${i + 1}</p>
          <h2 class="text-xl font-bold">${game}</h2>
        `;
        container.appendChild(card);
      });
    }

    render(juegos);

    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      render(juegos.filter(g => g.toLowerCase().includes(q)));
    });
  </script>

</body>
</html>
